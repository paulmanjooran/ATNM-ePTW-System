<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>ATNM Digital Permit to Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#12151A;
  --panel: rgba(255,255,255,.05); --panel2: rgba(255,255,255,.085); --panel3: rgba(255,255,255,.14);
  --border: rgba(255,255,255,.15); --border-soft: rgba(255,255,255,.08);
  --text:#EDEFF3; --text-dim:#A7AFB9; --text-faint:#6E7680;
  --carbon:#2E86DE; --carbon-dark:#153054;
  --tangerine:#FF7A1A; --tangerine-dim: rgba(255,122,26,.16);
  --blue:#2E86DE; --teal:#37B0F0;
  --safe:#22C55E; --safe-dim: rgba(34,197,94,.16);
  --warn:#F5A623; --warn-dim: rgba(245,166,35,.14);
  --amber:#F5A623; --amber-dim: rgba(245,166,35,.16);
  --danger:#EF4444; --danger-dim: rgba(239,68,68,.16);
  --critical:#DC2626;
  --grey:#6E7680;
  --grad-brand: linear-gradient(135deg,#2E86DE 0%,#FF7A1A 100%);
  --grad-safe: linear-gradient(135deg,#22C55E,#37B0F0);
  --grad-danger: linear-gradient(135deg,#EF4444,#DC2626);
  --glow-carbon: 0 0 1px rgba(46,134,222,.6), 0 0 22px rgba(46,134,222,.35);
  --glow-tangerine: 0 0 1px rgba(255,122,26,.65), 0 0 22px rgba(255,122,26,.4);
  --glow-safe: 0 0 1px rgba(34,197,94,.6), 0 0 18px rgba(34,197,94,.32);
  --glow-warn: 0 0 1px rgba(245,166,35,.6), 0 0 18px rgba(245,166,35,.3);
  --glow-danger: 0 0 1px rgba(239,68,68,.7), 0 0 20px rgba(239,68,68,.38);
  --glass-shadow: 0 8px 32px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.07);
  --radius:16px;
  --mono:'JetBrains Mono',monospace;
  --head:'Oswald',sans-serif;
  --body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;color:var(--text);font-family:var(--body);font-size:14px;-webkit-font-smoothing:antialiased;}
body{
  min-height:100vh;
  background:
    radial-gradient(900px 620px at 6% -8%, rgba(46,134,222,.24), transparent 60%),
    radial-gradient(900px 700px at 108% 4%, rgba(255,122,26,.16), transparent 60%),
    radial-gradient(1000px 800px at 50% 118%, rgba(46,134,222,.16), transparent 60%),
    radial-gradient(700px 600px at 96% 62%, rgba(255,122,26,.10), transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
a{color:var(--carbon);text-decoration:none;}
h1,h2,h3,h4{font-family:var(--head);font-weight:500;letter-spacing:.3px;margin:0;color:var(--text);}
button{font-family:var(--body);cursor:pointer;}
input,select,textarea{font-family:var(--body);}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--panel3);border-radius:5px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- Login ---------- */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
  background:
    radial-gradient(700px 500px at 8% 0%, rgba(46,134,222,.26), transparent 60%),
    radial-gradient(700px 500px at 100% 100%, rgba(255,122,26,.20), transparent 60%),
    radial-gradient(900px 700px at 50% 50%, rgba(46,134,222,.14), transparent 65%),
    var(--bg);
}
.login-box{width:100%;max-width:420px;background:rgba(255,255,255,.06);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);border:1px solid var(--border);border-radius:22px;overflow:hidden;box-shadow:var(--glass-shadow), 0 0 60px rgba(46,134,222,.14);}
.login-head{background:rgba(255,255,255,.035);padding:26px 28px 20px;border-bottom:1px solid var(--border-soft);position:relative;}
.login-head::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--grad-brand);box-shadow:var(--glow-carbon);}
.login-head .brandmark{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.login-head .brandmark .mark{width:34px;height:34px;background:var(--grad-brand);color:#0E1420;font-family:var(--head);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:15px;border-radius:10px;box-shadow:var(--glow-carbon);}
.login-head .brandline{font-family:var(--head);font-size:12px;letter-spacing:2px;color:var(--text-dim);}
.login-head h1{font-size:22px;color:var(--text);}
.login-head p{color:var(--text-dim);margin-top:4px;font-size:13px;}
.login-body{padding:24px 28px 28px;}
.login-body .field{margin-bottom:14px;}
.login-role-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px;}
.role-pick{border:1px solid var(--border);background:rgba(255,255,255,.045);backdrop-filter:blur(10px);border-radius:12px;padding:10px 8px;text-align:left;color:var(--text-dim);font-size:12px;line-height:1.3;}
.role-pick strong{display:block;color:var(--text);font-size:12.5px;font-family:var(--head);letter-spacing:.3px;font-weight:500;}
.role-pick.active{border-color:var(--tangerine);background:var(--tangerine-dim);color:var(--text);box-shadow:var(--glow-tangerine);}
.btn-primary{width:100%;background:var(--grad-brand);border:none;color:#0E1420;font-family:var(--head);font-size:14px;letter-spacing:.5px;padding:13px;border-radius:12px;font-weight:700;box-shadow:var(--glow-tangerine);}
.btn-primary:hover{filter:brightness(1.08);}
.login-foot{padding:12px 28px;border-top:1px solid var(--border-soft);color:var(--text-faint);font-size:11px;display:flex;justify-content:space-between;}

/* ---------- Shell ---------- */
.app-shell{display:grid;grid-template-columns:222px 1fr;min-height:100vh;}
.sidebar{background:rgba(255,255,255,.04);backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border-right:1px solid var(--border);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:40;}
.sidebar .brand{padding:16px 16px 14px;border-bottom:1px solid var(--border-soft);display:flex;align-items:center;gap:9px;}
.sidebar .brand .mark{width:28px;height:28px;background:var(--grad-brand);color:#0E1420;font-family:var(--head);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px;border-radius:8px;flex:none;box-shadow:var(--glow-carbon);}
.sidebar .brand div{font-family:var(--head);font-size:13px;letter-spacing:.6px;line-height:1.25;}
.sidebar .brand small{display:block;color:var(--text-faint);font-size:9.5px;letter-spacing:1.2px;}
.nav-group{padding:10px 8px;}
.nav-group .gt{font-size:10px;color:var(--text-faint);letter-spacing:1.4px;padding:8px 10px 4px;font-family:var(--head);}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--text-dim);font-size:13px;cursor:pointer;border-left:2px solid transparent;}
.nav-item .ic{width:18px;text-align:center;font-size:13px;flex:none;}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--text);}
.nav-item.active{background:rgba(46,134,222,.14);color:var(--text);border-left-color:var(--tangerine);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05), var(--glow-carbon);}
.nav-item .badge{margin-left:auto;background:var(--grad-danger);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-family:var(--mono);box-shadow:var(--glow-danger);}
.sidebar-foot{margin-top:auto;padding:12px;border-top:1px solid var(--border-soft);font-size:11px;color:var(--text-faint);}

.main{min-width:0;}
.topbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.04);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border-bottom:1px solid var(--border);padding:10px 20px;display:flex;align-items:center;gap:14px;}
.topbar .menu-btn{display:none;background:none;border:1px solid var(--border);color:var(--text);border-radius:10px;padding:6px 9px;font-size:14px;}
.topbar .search{flex:1;max-width:420px;position:relative;}
.topbar .search input{width:100%;background:rgba(255,255,255,.055);border:1px solid var(--border);color:var(--text);padding:8px 10px 8px 30px;border-radius:10px;font-size:13px;}
.topbar .search .ic{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:var(--text-faint);font-size:12px;}
.topbar .spacer{flex:1;}
.topbar .userchip{display:flex;align-items:center;gap:8px;border-left:1px solid var(--border-soft);padding-left:14px;}
.topbar .userchip .av{width:28px;height:28px;border-radius:50%;background:var(--grad-brand);display:flex;align-items:center;justify-content:center;font-family:var(--head);font-size:12px;color:#0E1420;border:1px solid var(--border);box-shadow:var(--glow-carbon);}
.topbar .userchip .who{line-height:1.2;}
.topbar .userchip .who b{font-size:12.5px;display:block;}
.topbar .userchip .who span{font-size:10.5px;color:var(--text-faint);}
.iconbtn{background:rgba(255,255,255,.035);border:1px solid var(--border);color:var(--text-dim);width:32px;height:32px;border-radius:10px;display:flex;align-items:center;justify-content:center;position:relative;font-size:14px;}
.iconbtn:hover{color:var(--text);border-color:var(--text-faint);}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;background:var(--grad-danger);color:#fff;font-size:9px;border-radius:9px;padding:0 4px;font-family:var(--mono);box-shadow:var(--glow-danger);}

.content{padding:20px 22px 60px;max-width:1400px;}
.view{display:none;}
.view.active{display:block;animation:fadein .18s ease;}
@keyframes fadein{from{opacity:0;transform:translateY(3px);}to{opacity:1;transform:none;}}

.pagehead{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
.pagehead h2{font-size:20px;}
.pagehead .eyebrow{font-size:11px;color:var(--tangerine);text-shadow:0 0 14px rgba(255,122,26,.4);font-family:var(--head);letter-spacing:1.6px;margin-bottom:3px;}
.pagehead p.sub{color:var(--text-dim);font-size:12.5px;margin-top:4px;}
.pagehead .actions{display:flex;gap:8px;}

/* ---------- Buttons ---------- */
.btn{border:1px solid var(--border);background:rgba(255,255,255,.05);backdrop-filter:blur(8px);color:var(--text);padding:8px 14px;border-radius:11px;font-size:12.5px;font-weight:500;display:inline-flex;align-items:center;gap:6px;}
.btn:hover{border-color:var(--text-faint);background:rgba(255,255,255,.09);}
.btn-amber{background:var(--grad-brand);border-color:transparent;color:#0E1420;font-weight:700;box-shadow:var(--glow-tangerine);}
.btn-amber:hover{filter:brightness(1.08);}
.btn-safe{background:var(--grad-safe);border-color:transparent;color:#052A1C;font-weight:700;box-shadow:var(--glow-safe);}
.btn-danger{background:var(--grad-danger);border-color:transparent;color:#fff;font-weight:700;box-shadow:var(--glow-danger);}
.btn-ghost{background:none;}
.btn-sm{padding:5px 10px;font-size:11.5px;border-radius:9px;}
.btn-lg{padding:13px 20px;font-size:14px;font-family:var(--head);letter-spacing:.4px;border-radius:13px;}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none;}
.btn-block{width:100%;justify-content:center;}

/* ---------- Cards / grid ---------- */
.grid{display:grid;gap:14px;}
.g-4{grid-template-columns:repeat(4,1fr);}
.g-3{grid-template-columns:repeat(3,1fr);}
.g-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.g-4{grid-template-columns:repeat(2,1fr);}.g-3{grid-template-columns:repeat(2,1fr);}}
@media(max-width:640px){.g-4,.g-3,.g-2{grid-template-columns:1fr;}}

.kpi{background:rgba(255,255,255,.05);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%);border:1px solid var(--border);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden;box-shadow:var(--glass-shadow);}
.kpi .kv{font-family:var(--head);font-size:26px;line-height:1;}
.kpi .kl{color:var(--text-dim);font-size:11px;margin-top:6px;letter-spacing:.3px;}
.kpi .ktrend{font-size:10.5px;margin-top:6px;font-family:var(--mono);}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--border-soft);}
.kpi.k-amber::before{background:var(--amber);box-shadow:var(--glow-warn);} .kpi.k-safe::before{background:var(--safe);box-shadow:var(--glow-safe);}
.kpi.k-danger::before{background:var(--danger);box-shadow:var(--glow-danger);} .kpi.k-blue::before{background:var(--carbon);box-shadow:var(--glow-carbon);}
.kpi.clickable{cursor:pointer;} .kpi.clickable:hover{border-color:var(--text-faint);transform:translateY(-1px);}

.card{background:rgba(255,255,255,.045);backdrop-filter:blur(16px) saturate(130%);-webkit-backdrop-filter:blur(16px) saturate(130%);border:1px solid var(--border);border-radius:16px;padding:16px;box-shadow:var(--glass-shadow);}
.card + .card{margin-top:14px;}
.card h3{font-size:14px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;}
.card h3 small{color:var(--text-faint);font-family:var(--body);font-size:11px;font-weight:400;}

/* ---------- Table ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.025);backdrop-filter:blur(10px);}
table{width:100%;border-collapse:collapse;font-size:12.5px;min-width:720px;}
thead th{text-align:left;background:rgba(255,255,255,.045);color:var(--text-dim);font-size:10.5px;letter-spacing:.6px;padding:9px 12px;border-bottom:1px solid var(--border);white-space:nowrap;font-family:var(--head);font-weight:500;}
tbody td{padding:9px 12px;border-bottom:1px solid var(--border-soft);white-space:nowrap;color:var(--text);}
tbody tr:hover{background:rgba(255,255,255,.045);}
tbody tr:last-child td{border-bottom:none;}
.tbl-link{color:var(--carbon);cursor:pointer;font-family:var(--mono);font-weight:600;text-shadow:0 0 10px rgba(46,134,222,.3);}
.tbl-toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:rgba(255,255,255,.045);backdrop-filter:blur(14px);border:1px solid var(--border);border-bottom:none;border-radius:14px 14px 0 0;}
.tbl-toolbar input,.tbl-toolbar select{background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text);padding:7px 9px;border-radius:9px;font-size:12px;}
.tbl-toolbar .grow{flex:1;min-width:160px;}

/* ---------- Pills / chips (RAG applied to status/safety states) ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;padding:3px 9px;border-radius:20px;font-family:var(--head);letter-spacing:.4px;font-weight:500;white-space:nowrap;border:1px solid transparent;backdrop-filter:blur(6px);}
.pill-dot{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 6px currentColor;}
.pill-draft{background:rgba(255,255,255,.08);color:#B9C0C9;border-color:rgba(255,255,255,.12);}
.pill-submitted{background:rgba(46,134,222,.14);color:#7EBBF5;border-color:rgba(46,134,222,.32);}
.pill-review{background:rgba(245,166,35,.14);color:var(--amber);border-color:rgba(245,166,35,.32);box-shadow:0 0 12px rgba(245,166,35,.16);}
.pill-returned{background:var(--tangerine-dim);color:#FFB16A;border-color:rgba(255,122,26,.32);}
.pill-approved{background:rgba(34,197,94,.14);color:#6FE39B;border-color:rgba(34,197,94,.32);box-shadow:0 0 12px rgba(34,197,94,.16);}
.pill-issued{background:rgba(46,134,222,.14);color:#7EBBF5;border-color:rgba(46,134,222,.32);}
.pill-active{background:rgba(34,197,94,.16);color:#6FE39B;border-color:rgba(34,197,94,.35);box-shadow:0 0 14px rgba(34,197,94,.22);}
.pill-suspended{background:rgba(239,68,68,.16);color:#FF9E9E;border-color:rgba(239,68,68,.35);box-shadow:0 0 14px rgba(239,68,68,.22);}
.pill-revalidation{background:rgba(245,166,35,.14);color:var(--amber);border-color:rgba(245,166,35,.3);}
.pill-expiring{background:rgba(245,166,35,.16);color:#FFCB7A;border-color:rgba(245,166,35,.35);box-shadow:0 0 12px rgba(245,166,35,.22);}
.pill-expired{background:rgba(239,68,68,.14);color:#FF9E9E;border-color:rgba(239,68,68,.3);}
.pill-complete{background:rgba(46,134,222,.14);color:#7EBBF5;border-color:rgba(46,134,222,.32);}
.pill-handback{background:rgba(46,134,222,.14);color:#7EBBF5;border-color:rgba(46,134,222,.32);}
.pill-closed{background:rgba(255,255,255,.06);color:var(--text-faint);border-color:rgba(255,255,255,.1);}
.pill-rejected{background:rgba(239,68,68,.14);color:#FF9E9E;border-color:rgba(239,68,68,.3);}
.pill-cancelled{background:rgba(255,255,255,.06);color:var(--text-faint);border-color:rgba(255,255,255,.1);}

.chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;padding:3px 8px;border-radius:8px;font-weight:600;letter-spacing:.2px;border:1px solid rgba(255,255,255,.1);backdrop-filter:blur(6px);}
/* Risk scale uses a Green -> Amber -> Tangerine -> Red escalation (RAG extended for 4 criticality tiers) */
.risk-R1{background:rgba(34,197,94,.14);color:#6FE39B;} .risk-R2{background:rgba(245,166,35,.16);color:#FFCB7A;}
.risk-R3{background:var(--tangerine-dim);color:#FFB16A;} .risk-R4{background:rgba(239,68,68,.16);color:#FF9E9E;box-shadow:0 0 10px rgba(239,68,68,.28);}

/* ---------- Forms ---------- */
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11.5px;color:var(--text-dim);font-family:var(--head);letter-spacing:.3px;}
.field label .req{color:var(--danger);}
.field input,.field select,.field textarea{background:rgba(255,255,255,.055);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:10px;font-size:13px;width:100%;}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--carbon);box-shadow:var(--glow-carbon);}
.field textarea{resize:vertical;min-height:64px;}
.field .hint{font-size:10.5px;color:var(--text-faint);}
.form-row{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:14px;}
.form-row.c3{grid-template-columns:repeat(3,1fr);}
@media(max-width:760px){.form-row,.form-row.c3{grid-template-columns:1fr;}}
.check-row{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(--border-soft);}
.check-row:last-child{border-bottom:none;}
.toggle{position:relative;width:38px;height:21px;flex:none;}
.toggle input{opacity:0;width:0;height:0;}
.toggle .tr{position:absolute;inset:0;background:var(--panel3);border:1px solid var(--border);border-radius:20px;transition:.15s;}
.toggle .tr:before{content:'';position:absolute;width:15px;height:15px;left:2px;top:2px;background:var(--text-faint);border-radius:50%;transition:.15s;}
.toggle input:checked + .tr{background:rgba(34,197,94,.22);border-color:var(--safe);box-shadow:var(--glow-safe);}
.toggle input:checked + .tr:before{transform:translateX(17px);background:var(--safe);}

/* ---------- Wizard ---------- */
.steps{display:flex;gap:0;margin-bottom:22px;border:1px solid var(--border);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.025);backdrop-filter:blur(10px);}
.step{flex:1;padding:10px 12px;background:transparent;border-right:1px solid var(--border-soft);font-size:11px;color:var(--text-faint);position:relative;}
.step:last-child{border-right:none;}
.step b{display:block;font-family:var(--head);font-size:12px;color:var(--text-dim);}
.step.done{color:var(--safe);} .step.done b{color:var(--safe);}
.step.current{background:rgba(46,134,222,.12);} .step.current b{color:var(--tangerine);}
.step.current::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:var(--grad-brand);box-shadow:var(--glow-carbon);}
@media(max-width:820px){.steps{display:none;}}

.gate{border:1px solid rgba(245,166,35,.4);background:var(--warn-dim);backdrop-filter:blur(14px);border-radius:14px;padding:16px;margin-bottom:18px;box-shadow:0 0 26px rgba(245,166,35,.12);}
.gate h4{color:var(--amber);font-size:13px;margin-bottom:6px;}
.gate p{font-size:12.5px;color:var(--text-dim);margin:0 0 10px;}

.hazard-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
@media(max-width:900px){.hazard-grid{grid-template-columns:repeat(2,1fr);}}
.hz{border:1px solid var(--border);background:rgba(255,255,255,.04);backdrop-filter:blur(8px);border-radius:11px;padding:10px;font-size:12px;display:flex;gap:8px;align-items:flex-start;cursor:pointer;}
.hz input{margin-top:2px;}
.hz.checked{border-color:var(--carbon);background:rgba(46,134,222,.12);box-shadow:var(--glow-carbon);}

/* ---------- Crew list ---------- */

<script>

let STATE = { userId:null, view:'dashboard', permitId:null, detailTab:'overview', reportTab:'applicant', adminTab:'users', tbtLang:'English', wizard:null, regFilter:{q:'',status:'',division:'',type:''}, hseFilter:{division:'',project:'',adviser:'',scope:'all'} };
function CU(){ return user(STATE.userId); }

const STATUS_CLASS = {'Draft':'draft','Submitted':'submitted','Under Review':'review','Returned':'returned','Approved':'approved','Issued':'issued','Active':'active','Suspended':'suspended','Revalidation Required':'revalidation','Expired':'expired','Work Complete':'complete','Awaiting Handback':'handback','Closed':'closed','Rejected':'rejected','Cancelled':'cancelled'};
function PT(code){ return PERMIT_TYPES.find(p=>p.code===code); }
function RL(code){ return RISK_LEVELS.find(r=>r.code===code); }
function PROJ(id){ return PROJECTS.find(p=>p.id===id); }
function permitById(id){ return PERMITS.find(p=>p.id===id); }

function statusPill(status){ return `<span class="pill pill-${STATUS_CLASS[status]||'draft'}"><i class="pill-dot"></i>${status}</span>`; }
function typeChip(code){ const t=PT(code); if(!t) return ''; return `<span class="chip" style="background:${t.color}22;color:${t.color};border-color:${t.color}55">${t.code}</span>`; }
function riskChip(code){ const r=RL(code); if(!r) return ''; return `<span class="chip risk-${code}">${code} · ${r.name}</span>`; }
function initials(name){ return name.split(' ').map(n=>n[0]).slice(0,2).join('').toUpperCase(); }
function fmtDT(d){ if(!d) return '—'; const dt=(d instanceof Date)?d:new Date(d); return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
function fmtTime(d){ if(!d) return '—'; const dt=(d instanceof Date)?d:new Date(d); return dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }

function countdownStr(permit){
  if(!permit.validTo) return {text:'—',cls:'',pct:0};
  const diffMs = permit.validTo - now;
  if(permit.status==='Suspended') return {text:'STOPPED', cls:'danger'};
  if(permit.status==='Closed') return {text:'CLOSED', cls:'grey'};
  if(diffMs<=0) return {text:'EXPIRED', cls:'danger'};
  const totalMin = Math.floor(diffMs/60000);
  const h=Math.floor(totalMin/60), m=totalMin%60;
  const cls = totalMin<=30 ? 'amber' : 'safe';
  return {text:`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')} REMAINING`, cls, pct: Math.max(0,Math.min(100, (diffMs/((permit.validTo-permit.validFrom))*100)))};
}

function toast(msg, kind){
  const wrap=document.getElementById('toastWrap');
  const el=document.createElement('div'); el.className='toast'+(kind?(' '+kind):''); el.textContent=msg;
  wrap.appendChild(el); setTimeout(()=>{el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300);}, 3600);
}

// ===================== LOGIN / AUTHENTICATION =====================
const LOCAL_DEMO_PASSWORD = 'Welcome@1'; // ONLY used when no Google Sheet backend is connected — see loginConnStatus note
const REQUIRED_EMAIL_DOMAIN = '@altasnim.com'; // must match REQUIRED_EMAIL_DOMAIN in Code.gs
let AUTH_TOKEN = null;

function renderLoginConnStatus(){
  const el = document.getElementById('loginConnStatus'); if(!el) return;
  if(CONFIG.apiUrl){
    el.innerHTML = `● Connected to Google Sheet — sign-in is verified against real accounts. <a href="#" onclick="openConnectModal();return false;" style="color:var(--carbon);">Change</a>`;
  } else {
    el.innerHTML = `⚠ No backend connected — local demo login only (any seeded Employee ID, password <b>${LOCAL_DEMO_PASSWORD}</b>). <a href="#" onclick="openConnectModal();return false;" style="color:var(--carbon);">Connect Google Sheet</a> for real authentication.`;
  }
}
function openConnectModal(){
  openModal(`<div class="mhead"><h4>Connect Google Sheet Backend</h4><button class="xbtn" onclick="closeModal()">✕</button></div>
  <div class="mbody">
  <p style="font-size:12px;color:var(--text-dim);margin-bottom:12px;">Paste your Apps Script Web App URL (ends in <code>/exec</code>). This only stores the URL in this browser — no data is fetched until you sign in.</p>
  <div class="field"><label>Google Apps Script Web App URL</label><input id="loginApiUrlInput" placeholder="https://script.google.com/macros/s/XXXXXXXX/exec" value="${CONFIG.apiUrl||''}"></div>
  </div>
  <div class="mfoot">${CONFIG.apiUrl?'<button class="btn btn-danger btn-sm" onclick="disconnectSheet();closeModal();renderLoginConnStatus();">Disconnect</button>':''}<button class="btn" onclick="closeModal()">Cancel</button><button class="btn btn-amber" onclick="saveConnectFromLogin()">Save</button></div>`);
}
function saveConnectFromLogin(){
  const url=document.getElementById('loginApiUrlInput').value.trim();
  if(!url){ toast('Paste the Apps Script Web App URL first.','danger'); return; }
  CONFIG.apiUrl=url; storeApiUrl(url); SYNC_STATE={connected:false,syncing:false,lastSync:null,lastError:null};
  closeModal(); renderLoginConnStatus(); toast('Google Sheet URL saved. Sign in to verify the connection.');
}
function roleLabel(r){ return {applicant:'Applicant',authorizer:'Authorizer',hse:'HSE Adviser',holder:'Permit Holder',admin:'System Admin',viewer:'Management'}[r]||r; }

function showLoginError(msg){
  const el=document.getElementById('loginError');
  if(msg){ el.textContent=msg; el.style.display='block'; } else { el.style.display='none'; }
}
async function doLogin(){
  const employeeId = document.getElementById('loginId').value.trim();
  const password = document.getElementById('loginPassword').value;
  showLoginError(null);
  if(!employeeId || !password){ showLoginError('Enter both your Employee ID and password.'); return; }
  const btn=document.getElementById('loginSubmitBtn'); btn.disabled=true; btn.textContent='SIGNING IN…';

  try{
    if(CONFIG.apiUrl){
      const res = await apiCallRaw('login', {employeeId, password});
      if(res.error || !res.ok){ showLoginError(res.error||'Sign-in failed — check your Employee ID and password.'); return; }
      AUTH_TOKEN = res.token;
      STATE.userId = res.user.id;
      // Merge the just-logged-in profile into USERS immediately — enterApp() below
      // needs CU() to resolve right now, and the full sync from the Sheet hasn't
      // landed yet (it's fired async, right after). Without this, any real user
      // whose ID isn't one of the local demo IDs hits a blank screen.
      const idx = USERS.findIndex(u=>u.id===res.user.id);
      if(idx>-1) Object.assign(USERS[idx], res.user); else USERS.push(res.user);
      // Session persisted for this browser tab only (per-viewer convenience) so a refresh doesn't force re-login.
      try{ sessionStorage.setItem('atnm_eptw_session', JSON.stringify({token:AUTH_TOKEN, userId:STATE.userId, apiUrl:CONFIG.apiUrl})); }catch(e){}
      enterApp();
      syncFromSheet();
    } else {
      const u = USERS.find(x=>x.id===employeeId);
      if(!u){ showLoginError('No account found for that Employee ID.'); return; }
      if(password !== LOCAL_DEMO_PASSWORD){ showLoginError('Incorrect password. (Local demo mode password: '+LOCAL_DEMO_PASSWORD+')'); return; }
      AUTH_TOKEN = null;
      STATE.userId = u.id;
      enterApp();
    }
  } finally {
    btn.disabled=false; btn.textContent='SIGN IN';
  }
}
function enterApp(){
  const u=CU();
  if(!u){
    showLoginError('Signed in, but your profile could not be loaded. Please try again — if this repeats, contact your System Administrator.');
    AUTH_TOKEN=null; STATE.userId=null;
    try{ sessionStorage.removeItem('atnm_eptw_session'); }catch(e){}
    return;
  }
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('appShell').style.display='grid';
  document.getElementById('topAvatar').textContent = initials(u.name);
  document.getElementById('topUserName').textContent = u.name;
  document.getElementById('topUserRole').textContent = roleLabel(u.role)+' · '+u.division;
  renderSidebar(); go('dashboard');
}
async function logout(){
  if(AUTH_TOKEN){ apiCallRaw('logout', {token:AUTH_TOKEN}).catch(()=>{}); }
  try{ sessionStorage.removeItem('atnm_eptw_session'); }catch(e){}
  AUTH_TOKEN=null; STATE.userId=null;
  document.getElementById('appShell').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginPassword').value='';
  showLoginError(null); renderLoginConnStatus();
}
// Attempts to silently restore a session saved earlier in this browser tab.
async function tryRestoreSession(){
  let saved=null;
  try{ saved = JSON.parse(sessionStorage.getItem('atnm_eptw_session')||'null'); }catch(e){}
  if(!saved || !saved.token || saved.apiUrl!==CONFIG.apiUrl || !CONFIG.apiUrl) return false;
  try{
    const res = await apiCallRaw('whoami', {token:saved.token});
    if(res.ok && res.user){
      AUTH_TOKEN=saved.token; STATE.userId=res.user.id;
      const idx = USERS.findIndex(u=>u.id===res.user.id);
      if(idx>-1) Object.assign(USERS[idx], res.user); else USERS.push(res.user);
      enterApp(); syncFromSheet(false);
      return true;
    }
  }catch(e){}
  try{ sessionStorage.removeItem('atnm_eptw_session'); }catch(e){}
  return false;
}

  if(!CONFIG.apiUrl){ toast('Password changes require a connected Google Sheet backend.','amber'); return; }

// ===================== ANALYTICS HELPERS =====================
function simopsPairs(){
  let pairs=[], seen=new Set();
  PERMITS.forEach(p=>{ if(p.simopsWith){ const key=[p.id,p.simopsWith].sort().join('|'); if(!seen.has(key)){ seen.add(key); pairs.push([p.id,p.simopsWith]); } } });
  return pairs;
}
function scoreColor(s){ return s>=90?'var(--safe)': s>=75?'var(--amber)':'var(--danger)'; }
// Weighted score helper — pulls from Admin Console > Crew, Scoring & Config weights (CONFIG.weights),
// using only the sub-scores relevant to the role being scored, normalized to those weights.
function weightedScore(parts){
  let sumW=0, sumWV=0;
  parts.forEach(p=>{ const w=Math.max(0, CONFIG.weights[p.key]||0); sumW+=w; sumWV+=w*p.value; });
  if(sumW<=0) return Math.round(parts.reduce((s,p)=>s+p.value,0)/(parts.length||1));
  return Math.round(sumWV/sumW);
}
function applicantStats(uid){
  const mine = PERMITS.filter(p=>p.applicant===uid);
  const active = mine.filter(p=>['Active','Suspended'].includes(p.status));
  const visitsDone = active.filter(p=>p.dailyVisits && p.dailyVisits.length>0).length;
  const missed = Math.max(0, active.length - visitsDone);
  const unsafe = mine.reduce((s,p)=>s+(p.hseInspections||[]).filter(o=>o.classification==='UNSAFE'||o.classification==='MAJOR NON-COMPLIANCE').length,0);
  const stopwork = mine.reduce((s,p)=>s+(p.hseInspections||[]).filter(o=>o.classification==='STOP WORK').length,0);
  const safeObs = mine.reduce((s,p)=>s+(p.hseInspections||[]).filter(o=>o.classification==='SAFE').length,0);
  const returned = mine.filter(p=>p.status==='Returned').length;
  const closed = mine.filter(p=>p.status==='Closed').length;
  const fieldScore = active.length? Math.round((visitsDone/active.length)*100):100;
  const obsScore = Math.max(0,100-unsafe*20-stopwork*35);
  const qualScore = Math.max(0,100-returned*15);
  const score = weightedScore([{key:'quality',value:qualScore},{key:'field',value:fieldScore},{key:'hseObs',value:obsScore}]);
  return {mine,active,visitsDone,missed,unsafe,stopwork,safeObs,returned,closed,fieldScore,score};
}
function holderStats(uid){
  const mine = PERMITS.filter(p=>p.holder===uid);
  const current = mine.filter(p=>['Active','Suspended','Issued'].includes(p.status));
  const tbtDone = mine.filter(p=>p.tbt && p.tbt.done).length;
  const swcDone = mine.filter(p=>p.startWorkCheck && p.startWorkCheck.done).length;
  const tbtPct = mine.length? Math.round((tbtDone/mine.length)*100):100;
  const swcPct = mine.length? Math.round((swcDone/mine.length)*100):100;
  const unsafe = mine.reduce((s,p)=>s+(p.hseInspections||[]).filter(o=>o.classification==='UNSAFE'||o.classification==='MAJOR NON-COMPLIANCE').length,0);
  const stopwork = mine.reduce((s,p)=>s+(p.hseInspections||[]).filter(o=>o.classification==='STOP WORK').length,0);
  const crewManaged = new Set(mine.flatMap(p=>p.crewIds)).size;
  const obsScore = Math.max(0,100-unsafe*18-stopwork*30);
  const score = weightedScore([{key:'crew',value:tbtPct},{key:'controls',value:swcPct},{key:'hseObs',value:obsScore}]);
  return {mine,current,tbtPct,swcPct,unsafe,stopwork,crewManaged,score};
}
function locationStats(site){
  const mine = PERMITS.filter(p=>p.site===site);
  const active = mine.filter(p=>p.status==='Active').length;
  const unsafe = mine.reduce((s,p)=>s+(p.hseInspections||[]).filter(o=>o.classification==='UNSAFE'||o.classification==='MAJOR NON-COMPLIANCE').length,0);
  const safe = mine.reduce((s,p)=>s+(p.hseInspections||[]).filter(o=>o.classification==='SAFE').length,0);
  const stopwork = mine.reduce((s,p)=>s+(p.hseInspections||[]).filter(o=>o.classification==='STOP WORK').length,0);
  const inspected = mine.filter(p=>(p.hseInspections||[]).length>0).length;
  const coverage = mine.length? Math.round((inspected/mine.length)*100):0;
  const qualScore = Math.max(0, Math.min(100, Math.round(100 - unsafe*12 - stopwork*25 + Math.min(10,safe*2))));
  const obsScore = Math.max(0,100-unsafe*12-stopwork*25);
  const mineIds = new Set(mine.map(p=>p.id));
  const siteActions = ACTIONS.filter(a=>mineIds.has(a.source));
  const actionScore = siteActions.length? Math.round((siteActions.filter(a=>a.status==='Closed').length/siteActions.length)*100) : 100;
  const score = weightedScore([{key:'quality',value:qualScore},{key:'hseObs',value:obsScore},{key:'action',value:actionScore}]);
  return {mine,active,unsafe,safe,stopwork,inspected,coverage,score:Math.min(100,score)};
}

// Per-viewer convenience only — remembers the Apps Script URL in THIS browser
// so the person doesn't have to re-paste it every visit. Never shared between
// viewers; never used for permit data itself (that always lives in the Sheet).
function loadStoredApiUrl(){
  try{ const v = localStorage.getItem('atnm_eptw_api_url'); if(v) CONFIG.apiUrl = v; }catch(e){ /* storage unavailable — continue without it */ }
}
function storeApiUrl(url){
  try{ localStorage.setItem('atnm_eptw_api_url', url); }catch(e){ /* ignore — falls back to session-only */ }
}
async function apiCallRaw(action, payload){
  if(!CONFIG.apiUrl) return {offline:true};
  const res = await fetch(CONFIG.apiUrl, {
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight against Apps Script
    body: JSON.stringify({action, payload})
  });
  return await res.json();
}
// Authenticated calls — automatically attaches the current session token.
// If the backend reports the session is gone (expired/invalid), forces sign-out.
async function apiCall(action, payload){
  const res = await apiCallRaw(action, Object.assign({}, payload, {token: AUTH_TOKEN}));
  if(res && res.error==='AUTH_REQUIRED'){
    toast('Your session has expired — please sign in again.','danger');
    logout();
  }
  return res;
}
function hydratePermit(p){
  if(p.validFrom) p.validFrom = new Date(p.validFrom);
  if(p.validTo) p.validTo = new Date(p.validTo);
  if(!p.history) p.history=[]; if(!p.hazards) p.hazards=[]; if(!p.controls) p.controls=[]; if(!p.crewIds) p.crewIds=[];
  if(!p.dailyVisits) p.dailyVisits=[]; if(!p.hseInspections) p.hseInspections=[]; if(!p.revalidations) p.revalidations=[];
  return p;
}
async function syncFromSheet(showToast){
  if(!CONFIG.apiUrl || !AUTH_TOKEN) return;
  SYNC_STATE.syncing = true; if(STATE.view==='admin') renderView();
  try{
    const data = await apiCall('getAll', {});
    if(data.error){ SYNC_STATE.connected=false; SYNC_STATE.lastError=data.error; if(data.error!=='AUTH_REQUIRED') toast('Google Sheet sync error: '+data.error,'danger'); return false; }
    if(data.users && data.users.length){ USERS.length=0; USERS.push(...data.users); }
    if(data.employees && data.employees.length){ EMPLOYEES.length=0; EMPLOYEES.push(...data.employees); }
    if(data.permits && data.permits.length){ PERMITS.length=0; PERMITS.push(...data.permits.map(hydratePermit)); }
    if(data.actions){ ACTIONS.length=0; ACTIONS.push(...data.actions); }
    if(data.config){ Object.assign(CONFIG, data.config); if(data.config.weights) Object.assign(CONFIG.weights, data.config.weights); }
    if(data.divisions && data.divisions.length){ DIVISION_RECORDS.length=0; DIVISION_RECORDS.push(...data.divisions); syncDivisionNames(); }
    if(data.projects && data.projects.length){ PROJECTS.length=0; PROJECTS.push(...data.projects); }
    if(data.permitTypes && data.permitTypes.length){ PERMIT_TYPES.length=0; PERMIT_TYPES.push(...data.permitTypes); }
    if(data.riskLevels && data.riskLevels.length){ RISK_LEVELS.length=0; RISK_LEVELS.push(...data.riskLevels); }
    if(data.hazards && data.hazards.length){ HAZARDS_LIB.length=0; HAZARDS_LIB.push(...data.hazards.map(h=>h.name)); }
    SYNC_STATE.connected = true; SYNC_STATE.lastError=null; SYNC_STATE.lastSync = new Date();
    if(showToast!==false) toast('Connected to Google Sheet — data synced.');
    renderView();
    return true;
  }catch(err){
    SYNC_STATE.connected=false; SYNC_STATE.lastError=String(err);
    toast('Could not reach the Google Sheet backend — continuing in local demo mode.','danger');
    return false;
  } finally { SYNC_STATE.syncing=false; if(STATE.view==='admin') renderView(); }
}

function persistAction(a){

// keys in Code.gs. Returns the backend result so callers can show a specific

async function persistMaster(type, item){
  if(!CONFIG.apiUrl || !AUTH_TOKEN){ toast('Saved locally — connect a Google Sheet to persist this change.','amber'); return {ok:true, offline:true}; }

async function removeMasterRemote(type, key){

function connectSheet(){

function submitPermit(){
  const w=wz(), u=CU();
  permitSeq++;
  const proj = PROJ(w.project);
  const number = `ATNM-${abbr(w.division)}-${w.project.split('-').pop()}-${w.permitType}-2026-${String(permitSeq).padStart(5,'0')}`;
  const holderU = user(w.holder);
  const authorizerId = USERS.find(x=>x.role==='authorizer' && x.project===w.project)?.id || USERS.find(x=>x.role==='authorizer').id;
  const needsHse = ['R3','R4'].includes(w.riskLevel);
  const hseId = needsHse ? (USERS.find(x=>x.role==='hse' && x.project===w.project)?.id || USERS.find(x=>x.role==='hse').id) : null;
  const p = {
    id:'P-'+(1000+permitSeq), number, division:w.division, project:w.project, site:proj.site, area:w.area, location:w.location,
    workDescription:w.workDescription, equipment:w.equipment, workOrder:w.workOrder, raRef:w.raRef, jsaRef:w.jsaRef,
    permitType:w.permitType, riskLevel:w.riskLevel, hazards:w.hazards, controls:w.controls,
    applicant:u.id, authorizer:authorizerId, hseAdviser:hseId, holder:w.holder, crewIds:[...w.crewIds],
    status:'Submitted',
    startDate:w.startDate, startTime:w.startTime, endDate:w.endDate, endTime:w.endTime,
    validFrom:null, validTo:null,
    fieldVerification:{by:u.name, id:u.id, date:w.verifyDate, time:w.verifyTime, confirmed:true},
    history:[{action:'Field Verification Completed', by:u.name, date:w.verifyDate, time:w.verifyTime, comments:'Applicant confirmed physical worksite verification.'},
              {action:'Submitted', by:u.name, date:todayStr(), time:now.toTimeString().slice(0,5), comments:'Submitted for authorization.'}],
    tbt:null, startWorkCheck:null, dailyVisits:[], hseInspections:[], suspension:null, revalidations:[], handback:null, closure:null, simopsWith:null,
  };
  PERMITS.unshift(p);
  toast('Permit '+number+' submitted for authorization.','');
  persistPermit(p);
  notifyEmail(authorizerId, 'ATNM ePTW — Authorization Required: '+number, 'A new permit has been submitted and needs your authorization.\n\nPermit: '+number+'\nWork: '+w.workDescription+'\nLocation: '+w.location+'\nRisk: '+w.riskLevel+'\nApplicant: '+u.name+'\n\nOpen ATNM ePTW to review.');

}

    <td><button class="btn btn-sm" onclick="go('detail','${p.id}')">Open</button></td>

function renderLive(){
  const cats = {
    'Total Today': PERMITS.filter(p=>p.startDate===todayStr()||['Active','Suspended'].includes(p.status)).length,
    'Open': PERMITS.filter(p=>['Draft','Submitted','Under Review','Returned'].includes(p.status)).length,
    'Approved': PERMITS.filter(p=>p.status==='Approved').length,
    'Issued': PERMITS.filter(p=>p.status==='Issued').length,
    'Work in Progress': PERMITS.filter(p=>p.status==='Active').length,
    'Suspended': PERMITS.filter(p=>p.status==='Suspended').length,
    'Expiring Soon': PERMITS.filter(p=>p.status==='Active' && countdownStr(p).cls==='amber').length,
    'Expired': PERMITS.filter(p=>p.status==='Expired').length,
    'Awaiting Handback': PERMITS.filter(p=>p.status==='Awaiting Handback').length,
    'Closed': PERMITS.filter(p=>p.status==='Closed').length,
    'SIMOPS Alerts': simopsPairs().length,
    'PTW Violations': PERMITS.reduce((s,p)=>s+(p.hseInspections||[]).filter(o=>['UNSAFE','MAJOR NON-COMPLIANCE','STOP WORK'].includes(o.classification)).length,0),
  };
  const kpiCls = {'Suspended':'k-danger','Expiring Soon':'k-amber','SIMOPS Alerts':'k-danger','PTW Violations':'k-danger','Work in Progress':'k-safe','Closed':''};
  let cardsHtml = Object.entries(cats).map(([k,v])=>`<div class="kpi ${kpiCls[k]||''}"><div class="kv">${v}</div><div class="kl">${k.toUpperCase()}</div></div>`).join('');
  const live = PERMITS.filter(p=>['Active','Suspended','Issued'].includes(p.status));
  return `<div class="pagehead"><div><div class="eyebrow">REAL-TIME ASSURANCE</div><h2>Live PTW Control Centre</h2><p class="sub">Auto-refreshing snapshot of every permit in play across Al Tasnim operations.</p></div></div>
  <div class="grid g-4" style="margin-bottom:20px;">${cardsHtml}</div>
  <div class="tablewrap"><table><thead><tr><th>Permit No.</th><th>Type</th><th>Risk</th><th>Division</th><th>Location</th><th>Applicant</th><th>Holder</th><th>Crew</th><th>Status</th><th>Remaining</th><th>Visit</th><th>HSE</th><th>SIMOPS</th></tr></thead><tbody>
  ${live.map(p=>{ const c=countdownStr(p); const visitOk = (p.dailyVisits||[]).length>0; const hseOk=(p.hseInspections||[]).length>0;
    return `<tr onclick="go('detail','${p.id}')" style="cursor:pointer;">
    <td class="tbl-link">${p.number}</td><td>${typeChip(p.permitType)}</td><td>${riskChip(p.riskLevel)}</td><td>${p.division}</td><td>${p.location}</td>
    <td>${user(p.applicant).name}</td><td>${user(p.holder).name}</td><td>${p.crewIds.length}</td><td>${statusPill(p.status)}</td>
    <td class="countdown" style="color:${c.cls==='danger'?'var(--danger)':c.cls==='amber'?'var(--amber)':c.cls==='safe'?'var(--safe)':'var(--text-faint)'}">${c.text}</td>
    <td>${visitOk?'<span style="color:var(--safe)">✓ Done</span>':'<span style="color:var(--warn)">Pending</span>'}</td>
    <td>${hseOk?'<span style="color:var(--safe)">✓ Checked</span>':'<span style="color:var(--text-faint)">—</span>'}</td>
    <td>${p.simopsWith?'<span style="color:var(--danger)">⚠ Yes</span>':'—'}</td>
  </tr>`;}).join('')}

}

// ===================== PERMIT ACTIONS (mutators) =====================
function nowTime(){ return now.toTimeString().slice(0,5); }
function pushHistory(p, action, comments){ p.history.push({action, by:CU().name, date:todayStr(), time:nowTime(), comments:comments||''}); }

function actAuthorize(id, decision, comments){
  const p=permitById(id);
  if(decision==='approve'){
    if(['R3','R4'].includes(p.riskLevel) && p.hseAdviser){ p.status='Under Review'; pushHistory(p,'Authorized — Forwarded for HSE Concurrence',comments); toast('Permit authorized. Forwarded to HSE for mandatory concurrence.');
      notifyEmail(p.hseAdviser, 'ATNM ePTW — HSE Concurrence Required: '+p.number, 'Permit '+p.number+' ('+p.workDescription+') has been authorized and needs your HSE concurrence.\n\nLocation: '+p.location+'\nRisk: '+p.riskLevel+'\n\nOpen the permit in ATNM ePTW to review.'); }
    else { p.status='Approved'; pushHistory(p,'Approved',comments); toast('Permit approved.');
      notifyEmail(p.applicant, 'ATNM ePTW — Permit Approved: '+p.number, 'Your permit '+p.number+' ('+p.workDescription+') has been approved by '+CU().name+'.'+(comments?'\n\nComments: '+comments:'')); }
  } else if(decision==='return'){ p.status='Returned'; pushHistory(p,'Returned for Correction',comments); toast('Permit returned to applicant.','amber');
    notifyEmail(p.applicant, 'ATNM ePTW — Permit Returned: '+p.number, 'Your permit '+p.number+' was returned for correction by '+CU().name+'.\n\nComments: '+(comments||'None provided.')); }
  else if(decision==='reject'){ p.status='Rejected'; pushHistory(p,'Rejected',comments); toast('Permit rejected.','danger');
    notifyEmail(p.applicant, 'ATNM ePTW — Permit Rejected: '+p.number, 'Your permit '+p.number+' was rejected by '+CU().name+'.\n\nComments: '+(comments||'None provided.')); }
  persistPermit(p); closeModal(); renderView();
}
function actHse(id, decision, comments){
  const p=permitById(id);
  if(decision==='concur'){ p.status='Approved'; pushHistory(p,'HSE Concurrence Granted',comments); toast('HSE concurrence recorded. Permit approved.');
    notifyEmail([p.applicant, p.authorizer], 'ATNM ePTW — HSE Concurrence Granted: '+p.number, 'HSE concurrence was granted by '+CU().name+' for permit '+p.number+'. The permit is now Approved.'); }
  else if(decision==='return'){ p.status='Returned'; pushHistory(p,'HSE Returned',comments); toast('Returned by HSE.','amber');
    notifyEmail(p.applicant, 'ATNM ePTW — Permit Returned by HSE: '+p.number, 'HSE ('+CU().name+') returned permit '+p.number+' for correction.\n\nComments: '+(comments||'None provided.')); }
  else { p.status='Rejected'; pushHistory(p,'HSE Rejected / Stopped',comments); toast('Rejected by HSE.','danger');
    notifyEmail([p.applicant, p.authorizer], 'ATNM ePTW — Permit Rejected by HSE: '+p.number, 'HSE ('+CU().name+') rejected/stopped permit '+p.number+'.\n\nComments: '+(comments||'None provided.')); }
  persistPermit(p); closeModal(); renderView();
}
function actIssue(id){
  const p=permitById(id); p.status='Issued'; pushHistory(p,'Permit Issued & Transferred to Holder','Transferred to '+user(p.holder).name);
  toast('Permit issued and transferred to '+user(p.holder).name+'.'); persistPermit(p); renderView();
  notifyEmail(p.holder, 'ATNM ePTW — Permit Issued to You: '+p.number, 'Permit '+p.number+' ('+p.workDescription+') has been issued and transferred to you.\n\nLocation: '+p.location+'\n\nReview, verify the worksite and crew, then Accept the permit in ATNM ePTW.');
}
function actAccept(id){
  const p=permitById(id); pushHistory(p,'Permit Accepted by Holder','Location, crew and controls reviewed.');
  toast('Permit accepted. Complete Toolbox Talk to proceed.'); persistPermit(p); renderView();
}
function actGenerateTbt(id, langs){
  const p=permitById(id); p.tbt={done:false, generatedAt:nowTime(), languages:langs, crewCount:0, ack:null};
  pushHistory(p,'AI Toolbox Talk Generated', langs.join(', '));
  toast('Trilingual Toolbox Talk generated from approved scope, hazards and controls.'); persistPermit(p); renderView();
}
function actAckTbt(id, crewCount){
  const p=permitById(id); p.tbt.done=true; p.tbt.crewCount=crewCount; p.tbt.ack={by:user(p.holder).name, date:todayStr(), time:nowTime()};
  pushHistory(p,'Toolbox Talk Acknowledged', crewCount+' crew briefed and attendance confirmed.');
  toast('Toolbox Talk acknowledged for '+crewCount+' crew members.'); persistPermit(p); renderView();
}
function actStartWork(id, result){
  const p=permitById(id); p.startWorkCheck={done:true, result};
  if(result==='START WORK'){ p.status='Active'; p.validFrom=new Date(); const durH = (parseInt(p.endTime)||17) - (parseInt(p.startTime)||7); p.validTo = hoursFromNow(Math.max(1,durH)); pushHistory(p,'Start Work Check Passed — Work Started',''); toast('Permit is now ACTIVE.'); }
  else { pushHistory(p,'Start Work Check Failed — Stop, Condition Unsafe',''); toast('Marked unsafe — work not started.','danger'); }
  persistPermit(p); renderView();
}
function actDailyVisit(id, data){
  const p=permitById(id); p.dailyVisits.push({date:todayStr(), time:nowTime(), by:CU().name, ...data});
  pushHistory(p,'Applicant Daily Field Visit Logged', data.outcome);
  if(data.outcome==='UNSAFE – STOP WORK'){ actSuspendInternal(p,'Unsafe Condition identified during applicant field visit'); }
  toast('Daily field verification recorded — '+data.outcome+'.', data.outcome==='SATISFACTORY'?'':'amber'); persistPermit(p); closeModal(); renderView();
}
function actHseObservation(id, data){
  const p=permitById(id); const obs={date:todayStr(), time:nowTime(), by:CU().name, status:'Open', ...data};
  if(['SAFE'].includes(data.classification)) obs.status='Closed';
  p.hseInspections.push(obs);
  pushHistory(p,'HSE Field Verification — '+data.classification, data.observation);
  if(data.action){
    const newAct={id:'ACT-'+(100+ACTIONS.length+1), source:p.id, description:data.action, responsible:data.responsible||user(p.holder).name, targetDate:data.targetDate||todayStr(), status:'Open', raisedBy:CU().name};
    ACTIONS.unshift(newAct); persistAction(newAct);
    const respUser = USERS.find(u=>u.name===newAct.responsible);
    if(respUser) notifyEmail(respUser.id, 'ATNM ePTW — Corrective Action Assigned: '+p.number, 'A corrective action has been assigned to you on permit '+p.number+'.\n\nAction: '+data.action+'\nTarget date: '+newAct.targetDate+'\nRaised by: '+CU().name);
  }
  if(data.classification==='STOP WORK'){ actSuspendInternal(p,'HSE Stop Work — '+data.observation); notifyEmail([p.holder, p.applicant], 'ATNM ePTW — STOP WORK: '+p.number, 'HSE ('+CU().name+') issued a Stop Work on permit '+p.number+'.\n\n'+data.observation); }
  else if(['UNSAFE','MAJOR NON-COMPLIANCE'].includes(data.classification)){ notifyEmail(p.holder, 'ATNM ePTW — Unsafe Observation: '+p.number, 'HSE ('+CU().name+') logged a '+data.classification+' finding on permit '+p.number+'.\n\n'+data.observation); }
  toast('PTW field assurance report logged — '+data.classification+'.', data.classification==='SAFE'?'':'danger'); persistPermit(p); closeModal(); renderView();
}
function actSuspendInternal(p, reason){ if(p.status==='Active'){ p.status='Suspended'; p.suspension={reason, date:todayStr(), time:nowTime(), by:CU().name}; pushHistory(p,'Permit Suspended', reason); } }
function actSuspend(id, reason){ const p=permitById(id); actSuspendInternal(p,reason); toast('Permit suspended.','danger'); persistPermit(p); closeModal(); renderView();
  notifyEmail([p.holder, p.applicant], 'ATNM ePTW — Permit Suspended: '+p.number, 'Permit '+p.number+' was suspended by '+CU().name+'.\n\nReason: '+reason);
}
function actRevalidate(id, comments){
  const p=permitById(id); p.revalidations.push({date:todayStr(), time:nowTime(), by:CU().name, comments});
  p.status='Active'; p.suspension=null; p.validTo = hoursFromNow(CONFIG.revalidationLimitHours);
  pushHistory(p,'Permit Revalidated — Work Resumed', comments);
  toast('Permit revalidated. Work may resume.'); persistPermit(p); closeModal(); renderView();
}
function actHandback(id, notes, complete){
  const p=permitById(id); p.handback={by:user(p.holder).name, date:todayStr(), time:nowTime(), complete, notes};
  p.status='Awaiting Handback'; pushHistory(p,'Handed Back by Permit Holder', notes);
  toast('Permit handed back — awaiting authorizer acceptance.'); persistPermit(p); closeModal(); renderView();
}
function actClosure(id, decision){
  const p=permitById(id);
  if(decision==='accept'){ p.closure={by:CU().name, date:todayStr(), time:nowTime(), outcome:'ACCEPT HANDOVER'}; p.status='Closed'; pushHistory(p,'Permit Closed',''); toast('Permit closed.'); }
  else { p.status='Active'; pushHistory(p,'Handback Returned for Correction',''); toast('Returned for correction.','amber'); }
  persistPermit(p); renderView();
}

const DETAIL_TABS = [['overview','Overview'],['approval','Approval & Issue'],['toolbox','Toolbox Talk'],['field','Field Verification'],['hse','HSE & Observations'],['suspend','Suspend / Revalidate'],['handback','Handback & Closure'],['qr','QR Code']];
const TIMELINE_STEPS = ['Draft','Submitted','Under Review','Approved','Issued','Active','Work Complete','Awaiting Handback','Closed'];

function renderDetail(){
  const p = permitById(STATE.permitId);
  if(!p) return `<div class="empty">Permit not found. <button class="btn" onclick="go('register')">Back to Register</button></div>`;
  const c = countdownStr(p);
  let tlIdx = TIMELINE_STEPS.indexOf(p.status);
  const tl = TIMELINE_STEPS.map((s,i)=>{ let cls=''; if(['Rejected','Cancelled','Returned','Suspended','Expired'].includes(p.status)){ cls = i===0?'on':''; } else { if(tlIdx>=0 && i<tlIdx) cls='on'; if(i===tlIdx) cls+=' now'; } return `<div class="tl-step ${cls}"><b>${s}</b></div>`; }).join('');

  let simopsBanner='';
  if(p.simopsWith){ const other = permitById(p.simopsWith); simopsBanner = `<div class="simops-banner"><div class="ic">⚠</div><div><h4>SIMOPS ALERT</h4><p>This permit overlaps in time and location with <b class="tbl-link" onclick="go('detail','${other.id}')">${other.number}</b> (${other.workDescription}). Cross-notify both crews and review joint controls.</p></div></div>`; }
  if(p.status==='Suspended'){ simopsBanner += `<div class="simops-banner" style="border-color:var(--danger);"><div class="ic">🔴</div><div><h4>WORK STOPPED</h4><p>Suspended: ${p.suspension.reason} — by ${p.suspension.by} at ${p.suspension.time} on ${p.suspension.date}.</p></div></div>`; }
  const openHseUnsafe = (p.hseInspections||[]).filter(o=>o.status==='Open');
  if(openHseUnsafe.length){ simopsBanner += `<div class="simops-banner"><div class="ic">⚠</div><div><h4>${openHseUnsafe.length} Open HSE Finding${openHseUnsafe.length>1?'s':''}</h4><p>${openHseUnsafe[0].observation}</p></div></div>`; }

  return `<div class="pdhead">
    <div><div class="pno">${p.number}</div><div class="pdesc">${p.workDescription}</div>
    <div class="meta">
      <span><b>${p.division}</b> · ${PROJ(p.project)?PROJ(p.project).name:''}</span>
      <span>📍 ${p.location}</span>
      <span>Applicant: <b>${user(p.applicant).name}</b></span>
      <span>Holder: <b>${user(p.holder)?user(p.holder).name:'—'}</b></span>
      ${p.hseAdviser?`<span>HSE: <b>${user(p.hseAdviser).name}</b></span>`:''}
    </div></div>
    <div style="text-align:right;">
      ${typeChip(p.permitType)} ${riskChip(p.riskLevel)}<br>
      <div style="margin-top:8px;">${statusPill(p.status)}</div>
      ${p.status==='Active'?`<div class="countdown" style="margin-top:6px;color:${c.cls==='amber'?'var(--amber)':'var(--safe)'}">${c.text}</div>`:''}
    </div>
  </div>
  <div class="timeline">${tl}</div>
  ${simopsBanner}
  <div class="tabs">${DETAIL_TABS.map(([k,l])=>`<div class="tab ${STATE.detailTab===k?'active':''}" onclick="STATE.detailTab='${k}';renderView()">${l}</div>`).join('')}</div>
  ${detailTabContent(p)}`;
}
function detailTabContent(p){
  switch(STATE.detailTab){
    case 'approval': return tabApproval(p);
    case 'toolbox': return tabToolbox(p);
    case 'field': return tabField(p);
    case 'hse': return tabHse(p);
    case 'suspend': return tabSuspend(p);
    case 'handback': return tabHandback(p);
    case 'qr': return tabQr(p);

}

// ===================== SVG CHART HELPERS (glass/candy glow) =====================
let _chartUid=0;
function escXml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function chartGlowDefs(id){ return `<defs><filter id="glow${id}" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>`; }
function svgDonut(data, size){
  size = size||180; const id=++_chartUid;
  const total = data.reduce((s,d)=>s+d.value,0);
  const r = size/2-18, cx=size/2, cy=size/2;
  let angle=-90, arcs='';
  if(total<=0){
    arcs = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="rgba(255,255,255,.12)" stroke-width="20"/>`;
  } else {
    data.filter(d=>d.value>0).forEach(d=>{
      const frac=d.value/total; const start=angle; const sweep=Math.max(frac*360,0.5); angle+=sweep;
      const large = sweep>180?1:0;
      const x1=cx+r*Math.cos(start*Math.PI/180), y1=cy+r*Math.sin(start*Math.PI/180);
      const x2=cx+r*Math.cos((start+sweep)*Math.PI/180), y2=cy+r*Math.sin((start+sweep)*Math.PI/180);
      arcs += `<path d="M${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${large} 1 ${x2.toFixed(2)},${y2.toFixed(2)}" fill="none" stroke="${d.color}" stroke-width="20" stroke-linecap="round" filter="url(#glow${id})"/>`;
    });
  }
  return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${chartGlowDefs(id)}${arcs}
  <text x="${cx}" y="${cy-2}" text-anchor="middle" fill="#F6F4FF" font-family="Oswald,sans-serif" font-size="26" font-weight="500">${total}</text>
  <text x="${cx}" y="${cy+16}" text-anchor="middle" fill="rgba(255,255,255,.55)" font-family="Inter,sans-serif" font-size="10" letter-spacing="1">REPORTS</text>
  </svg>`;
}
function svgBarH(data, width){
  width = width||420; const id=++_chartUid;
  const max = Math.max(1, ...data.map(d=>d.value));
  const barH=20, gap=13, leftW=Math.min(150, width*0.36), rightPad=42;
  const chartW = width-leftW-rightPad;
  const h = data.length*(barH+gap)+6;
  let rows='';
  data.forEach((d,i)=>{
    const y=6+i*(barH+gap);
    const w = Math.max(3,(d.value/max)*chartW);
    rows += `<text x="0" y="${y+barH*0.72}" fill="rgba(255,255,255,.82)" font-size="11" font-family="Inter,sans-serif">${escXml(d.label)}</text>
    <rect x="${leftW}" y="${y}" width="${chartW}" height="${barH}" rx="7" fill="rgba(255,255,255,.06)"/>
    <rect x="${leftW}" y="${y}" width="${w.toFixed(1)}" height="${barH}" rx="7" fill="${d.color}" filter="url(#glow${id})"/>
    <text x="${leftW+chartW+8}" y="${y+barH*0.72}" fill="#fff" font-size="11" font-family="'JetBrains Mono',monospace">${d.display!==undefined?d.display:d.value}</text>`;
  });
  return `<svg viewBox="0 0 ${width} ${h}" width="100%" height="${h}">${chartGlowDefs(id)}${rows || `<text x="0" y="16" fill="rgba(255,255,255,.4)" font-size="12">No data</text>`}</svg>`;
}
function legendRow(data){
  return `<div class="legend-row">${data.map(d=>`<span><i class="legend-dot" style="background:${d.color};box-shadow:0 0 8px ${d.color}"></i>${d.label} (${d.value})</span>`).join('')}</div>`;
}

// ===================== STANDALONE HSE DASHBOARD =====================
function hseFilteredPermits(){
  const f=STATE.hseFilter;
  let list = PERMITS.slice();
  if(f.division) list = list.filter(p=>p.division===f.division);
  if(f.project) list = list.filter(p=>p.project===f.project);
  if(f.adviser) list = list.filter(p=>p.hseAdviser===f.adviser);
  if(f.scope==='today') list = list.filter(p=>p.startDate===todayStr() || ['Active','Suspended'].includes(p.status) || (p.hseInspections||[]).some(o=>o.date===todayStr()));
  return list;
}
function renderHseDashboard(){
  const f=STATE.hseFilter;
  const list = hseFilteredPermits();
  const liveList = list.filter(p=>['Active','Suspended','Issued'].includes(p.status));
  const assigned = list.filter(p=>p.hseAdviser);
  const inspectedToday = list.filter(p=>(p.hseInspections||[]).some(o=>o.date===todayStr())).length;
  const inspectedAny = liveList.filter(p=>(p.hseInspections||[]).length>0);
  const notInspected = liveList.length - inspectedAny.length;
  const coverage = liveList.length? Math.round((inspectedAny.length/liveList.length)*100):0;

  let allObs=[]; list.forEach(p=>(p.hseInspections||[]).forEach(o=>allObs.push({...o, permit:p})));
  const cCount = c => allObs.filter(o=>o.classification===c).length;
  const safeN=cCount('SAFE'), improveN=cCount('IMPROVEMENT OPPORTUNITY'), unsafeN=cCount('UNSAFE'), majorN=cCount('MAJOR NON-COMPLIANCE'), stopN=cCount('STOP WORK');

  const listIds = new Set(list.map(p=>p.id));
  const relevantActions = ACTIONS.filter(a=>listIds.has(a.source));
  const openActions = relevantActions.filter(a=>a.status==='Open').length;

  const catCounts={}; allObs.forEach(o=>{ catCounts[o.category]=(catCounts[o.category]||0)+1; });
  const repeatCats = Object.entries(catCounts).filter(([k,v])=>v>=2).sort((a,b)=>b[1]-a[1]);

  const advisers = USERS.filter(u=>u.role==='hse' && (!f.division || u.division===f.division));

    const theirs = PERMITS.filter(p=>p.hseAdviser===a.id);
    const theirsLive = theirs.filter(p=>['Active','Suspended','Issued'].includes(p.status));
    const insp = theirsLive.filter(p=>(p.hseInspections||[]).length>0).length;
    const pct = theirsLive.length? Math.round((insp/theirsLive.length)*100):0;
    return {label:a.name, value:pct, display:pct+'%', color: pct>=80?'#22C55E':pct>=50?'#F5A623':'#EF4444'};
  });

  const actionCatCounts={};
  list.forEach(p=>(p.hseInspections||[]).forEach(o=>{ if(o.action && o.status==='Open'){ actionCatCounts[o.category]=(actionCatCounts[o.category]||0)+1; } }));

  return `<div class="pagehead"><div><div class="eyebrow">VERIFY IT</div><h2>HSE Dashboard</h2><p class="sub">Standalone HSE assurance view — coverage, observation mix and corrective action load across the filtered scope.</p></div></div>

    <div class="field"><label>Project</label><select onchange="STATE.hseFilter.project=this.value;renderView()">

    <div class="field"><label>Scope</label><select onchange="STATE.hseFilter.scope=this.value;renderView()">
      <option value="all" ${f.scope==='all'?'selected':''}>All Time</option><option value="today" ${f.scope==='today'?'selected':''}>Today / Live</option></select></div>
    <button class="btn btn-sm" onclick="STATE.hseFilter={division:'',project:'',adviser:'',scope:'all'};renderView()">Reset</button>

  <div class="grid g-4" style="margin-bottom:16px;">

    <div class="kpi k-safe"><div class="kv">${inspectedToday}</div><div class="kl">INSPECTED TODAY</div></div>
    <div class="kpi ${notInspected>0?'k-danger':'k-safe'}"><div class="kv">${notInspected}</div><div class="kl">LIVE PERMITS NOT YET INSPECTED</div></div>
    <div class="kpi k-amber"><div class="kv">${coverage}%</div><div class="kl">HSE INSPECTION COVERAGE</div></div>
  </div>
  <div class="grid g-4" style="margin-bottom:16px;">
    <div class="kpi k-safe"><div class="kv">${safeN}</div><div class="kl">SAFE OBSERVATIONS</div></div>

          {label:'Improvement Opportunity',value:improveN,color:'#F5A623'},
          {label:'Unsafe',value:unsafeN,color:'#EF4444'},
          {label:'Major Non-Compliance',value:majorN,color:'#DC2626'},
          {label:'Stop Work',value:stopN,color:'#B91C1C'}
        ])}
        ${legendRow([
          {label:'Safe',value:safeN,color:'#22C55E'},

          {label:'Major',value:majorN,color:'#DC2626'},
          {label:'Stop Work',value:stopN,color:'#B91C1C'}
        ])}
      </div>
    </div>
    <div class="chartcard">
      <h3>Inspection Coverage by HSE Adviser</h3>
      ${svgBarH(adviserBars)}

  </div>

  <div class="grid g-2" style="margin-top:14px;align-items:stretch;">
    <div class="chartcard">

    <div class="chartcard">
      <h3>Repeat Findings <small>Category flagged 2+ times in scope</small></h3>
      ${repeatCats.length? `<div class="tablewrap" style="border:none;background:none;"><table><thead><tr><th>Category</th><th>Occurrences</th></tr></thead><tbody>
      ${repeatCats.map(([k,v])=>`<tr><td>${k}</td><td><span class="pill pill-review">${v}×</span></td></tr>`).join('')}

  </tbody></table></div></div>`;

function adminAudit(){
  let all=[];
  PERMITS.forEach(p=>p.history.forEach(h=>all.push({...h, permit:p.number, id:p.id})));
  all.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  return `<div class="card"><h3>System Audit Trail <small>${all.length} recorded events</small></h3>
  <div class="tablewrap"><table><thead><tr><th>Date / Time</th><th>Permit</th><th>Action</th><th>By</th><th>Comments</th></tr></thead><tbody>
  ${all.map(h=>`<tr><td>${h.date} ${h.time}</td><td class="tbl-link" onclick="go('detail','${h.id}')">${h.permit}</td><td>${h.action}</td><td>${h.by}</td><td>${h.comments||'—'}</td></tr>`).join('') || `<tr><td colspan="5"><div class="empty">No events recorded yet.</div></td></tr>`}
  </tbody></table></div></div>`;
}

// ===================== PERFORMANCE ALERTS (live, threshold-based) =====================
// Recomputed on every call from current PERMITS/ACTIONS/USERS — never a static list.
function computePerformanceAlerts(){
  let alerts = [];
  const add = (level, cat, text, opts) => alerts.push(Object.assign({level, cat, text}, opts||{}));

  USERS.filter(u=>u.role==='applicant').forEach(u=>{
    const s = applicantStats(u.id);
    if(s.mine.length && s.score<85) add('amber','Applicant Compliance', `${u.name} — applicant compliance ${s.score}% (below 85% threshold)`, {view:'reports', tab:'applicant'});
  });
  USERS.filter(u=>u.role==='holder').forEach(u=>{
    const s = holderStats(u.id);
    if(s.mine.length && s.score<85) add('amber','Permit Holder Compliance', `${u.name} — Permit Holder compliance ${s.score}% (below 85% threshold)`, {view:'reports', tab:'holder'});
  });
  PERMITS.filter(p=>['Active','Suspended'].includes(p.status) && (!p.dailyVisits || !p.dailyVisits.length)).forEach(p=>{
    add('danger','Missed Applicant Field Visit', `${p.number} — no daily field visit logged by the Applicant`, {permitId:p.id});
  });
  PERMITS.forEach(p=>{
    const bad = (p.hseInspections||[]).filter(o=>['UNSAFE','MAJOR NON-COMPLIANCE'].includes(o.classification));
    if(bad.length>=2) add('danger','Repeated Unsafe Observation', `${p.number} — ${bad.length} unsafe/major findings recorded on this permit`, {permitId:p.id});
  });
  PERMITS.forEach(p=>{
    (p.hseInspections||[]).filter(o=>o.classification==='MAJOR NON-COMPLIANCE' && o.status==='Open').forEach(o=>{
      add('danger','Major PTW Violation', `${p.number} — major non-compliance open: ${o.observation}`, {permitId:p.id});
    });
  });
  PERMITS.filter(p=>p.status==='Active' && p.validTo && new Date(p.validTo) < now).forEach(p=>{
    add('danger','Permit Expired While Active', `${p.number} — validity window has passed but status is still Active`, {permitId:p.id});
  });
  const controlCats = ['Isolation','Barricading','PPE','Equipment','Excavation','Height','Lifting','Hot Work','Confined Space'];
  PERMITS.forEach(p=>{
    (p.hseInspections||[]).filter(o=>controlCats.includes(o.category) && ['UNSAFE','MAJOR NON-COMPLIANCE','STOP WORK'].includes(o.classification) && o.status==='Open').forEach(o=>{
      add('danger','Critical Control Missing', `${p.number} — ${o.category} control gap: ${o.observation}`, {permitId:p.id});
    });
  });
  const catCounts={};
  PERMITS.forEach(p=>(p.hseInspections||[]).forEach(o=>{ catCounts[o.category]=(catCounts[o.category]||0)+1; }));
  Object.entries(catCounts).filter(([k,v])=>v>=2).forEach(([k,v])=>{
    add('amber','Repeat Finding', `${k} — flagged ${v} times across the organization`, {view:'hsedash'});
  });
  simopsPairs().forEach(([a,b])=>{
    const pa=permitById(a), pb=permitById(b);
    add('danger','SIMOPS Conflict', `${pa.number} overlaps with ${pb.number} at ${pa.location}`, {permitId:a});
  });

  const rank={danger:0,amber:1};
  return alerts.sort((x,y)=>rank[x.level]-rank[y.level]);
}
function alertGoto(a){
  if(a.permitId){ go('detail', a.permitId); return; }
  if(a.view){ go(a.view); if(a.tab){ STATE.reportTab=a.tab; renderView(); } return; }
}
let ALERTS_CACHE = [];
function alertGotoIdx(i){ const a=ALERTS_CACHE[i]; if(a) alertGoto(a); }
function updateNotifBadge(){
  const el=document.getElementById('notifDot'); if(!el) return;
  const n = computePerformanceAlerts().filter(a=>a.level==='danger').length;
  el.textContent = n; el.style.display = n>0 ? 'inline-block' : 'none';
}

// ===================== NOTIFICATIONS =====================
function renderNotifications(){
  const alerts = computePerformanceAlerts();
  ALERTS_CACHE = alerts;
  const dangerN = alerts.filter(a=>a.level==='danger').length, amberN = alerts.filter(a=>a.level==='amber').length;
  return `<div class="pagehead"><div><div class="eyebrow">SYSTEM</div><h2>Notifications &amp; Performance Alerts</h2><p class="sub">Performance Alerts are computed live from current permits, observations and compliance scores — not a static feed.</p></div></div>
  <div class="grid g-3" style="margin-bottom:16px;"><div class="kpi k-danger"><div class="kv">${dangerN}</div><div class="kl">CRITICAL ALERTS</div></div><div class="kpi k-amber"><div class="kv">${amberN}</div><div class="kl">ADVISORY ALERTS</div></div><div class="kpi"><div class="kv">${alerts.length}</div><div class="kl">TOTAL</div></div></div>
  <div class="section-title">Performance Alerts</div>
  ${alerts.length? alerts.map((a,i)=>`<div class="card" style="border-left:3px solid ${a.level==='danger'?'var(--danger)':'var(--amber)'};cursor:${a.permitId||a.view?'pointer':'default'};" onclick="alertGotoIdx(${i})"><div class="flex-between"><span style="font-size:13px;"><span class="badge-role" style="margin-right:8px;">${a.cat}</span>${a.text}</span></div></div>`).join('') : `<div class="empty">No active performance alerts — all thresholds within range.</div>`}
  <div class="section-title">System Notifications</div>
  ${NOTIFICATIONS.map(n=>`<div class="card" style="border-left:3px solid ${n.type==='danger'?'var(--danger)':n.type==='amber'?'var(--amber)':'var(--safe)'};"><div class="flex-between"><span style="font-size:13px;">${n.text}</span><span style="font-size:11px;color:var(--text-faint);">${n.time}</span></div></div>`).join('')}`;
}
